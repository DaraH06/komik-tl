[workspace]
# NOTE: crate Koharu upstream (koharu-rs/koharu) ditambahkan di M1 via git subtree —
# lihat docs/crate-audit.md. Namanya pertahankan apa adanya, jangan rename.
members = ["crates/koharu-android", "crates/koharu-langs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Android-first comic reader + translator engine (Koharu-derived)"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.32"

[profile.release]
opt-level = 2
# LTO off initially — matikan saat toolchain ada (testing dulu)
