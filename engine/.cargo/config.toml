[build]
# Target utama: ARM64 Android (arm64-v8a). Build via `cargo ndk -t arm64-v8a`.
target = "aarch64-linux-android"

[target.aarch64-linux-android]
# Linker disediakan oleh cargo-ndk saat build (placeholder di M0)
linker = "cargo-ndk-linker"
# Wajib untuk Google Play target 15+: 16 KB page size (16384)
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[env]
# Debug fuel: lihat docs/architecture.md
# KOHARU_DEBUG_STAGES = "1"
